<!DOCTYPE html>

<head>

<style>
  html, body { margin: 0; height: 100%; background: #2B2520; color: #EDE7D7; font-family: 'EB Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  * { box-sizing: border-box; }
  p { text-wrap: pretty; }
  button { font-family: inherit; }
  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; }
  @keyframes drawRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #cardBody h3 { margin: 26px 0 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 22px; color: #2B2520; border-top: 1px solid rgba(122,26,60,.25); padding-top: 16px; }
  #cardBody p { margin: 0 0 10px; font-size: 17px; line-height: 1.65; color: #4a4137; }
  /* one themed cursor everywhere: Cupid's arrow. Over anything you can click, the same arrow lights up
     (rose heart, gold glow). The hot spot is the tip of the heart. */
  :root { --cur: url("assets/cursor.png") 3 3, auto; --cur-on: url("assets/cursor-on.png") 3 3, pointer; }   /* pre-rendered PNGs: an SVG cursor is re-rasterised on every change, which flashes the default arrow */
  html, body, #view { cursor: var(--cur); }
  button { cursor: var(--cur-on) !important; }
  .cbtn { width: 28px; height: 28px; border-radius: 50%; background: rgba(26,18,8,.55); backdrop-filter: blur(2px); border: 1px solid rgba(232,192,122,.7); color: #F2E6C9; display: grid; place-items: center; padding: 0; transition: opacity 400ms ease, background 200ms ease; }
  .cbtn:hover { background: rgba(232,192,122,.22); }
  /* at a details-room picture close-up the wall's button sits at the bottom centre, so the compass moves to the corner */
  #compass.corner { left: clamp(12px,2vw,24px) !important; transform: none !important; }
  /* the info panel's text eases in afresh each time it changes, so a new write-up catches the eye */
  @keyframes labelIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  #label .fresh { animation: labelIn 900ms ease both; }
  #label .fresh + * , #label div + div .fresh { animation-delay: 140ms; }
</style>
</head>
<body>
<div id="shell">
  <div id="stage"><canvas id="view"></canvas>
<div id="tally" style="position:absolute;left:14px;top:12px;z-index:14;opacity:0;transition:opacity 900ms ease;padding:4px 12px;border-radius:12px;background:rgba(26,18,8,.5);backdrop-filter:blur(2px);font-family:'Cormorant Garamond',Georgia,serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#F2DFA8;pointer-events:none;white-space:nowrap"></div>
<div id="motto" style="position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:clamp(60px,12vh,120px) clamp(20px,6vw,70px) clamp(20px,6vw,70px);pointer-events:none;opacity:0;transition:opacity 2200ms ease">
  <div style="max-width:min(760px,94vw);text-align:center;padding:clamp(36px,6vw,80px) clamp(40px,8vw,110px);background:radial-gradient(ellipse closest-side,rgba(251,246,232,.7) 0%,rgba(251,246,232,.54) 50%,rgba(251,246,232,0) 100%)">
    <p style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-style:italic;font-size:clamp(24px,3.6vw,42px);line-height:1.26;background:linear-gradient(104deg,#8a6518 0%,#a67d24 24%,#96711e 50%,#a67d24 76%,#8a6518 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(255,250,235,.7)) drop-shadow(0 1px 2px rgba(70,48,8,.45))">&ldquo;I am a museum of everything I&rsquo;ve ever loved&hellip;&rdquo;</p>
  </div>
</div>
    <button id="turn" aria-label="Turn around" style="opacity:0;transition:opacity 900ms ease;position:absolute;right:clamp(12px,2vw,24px);bottom:clamp(10px,1.6vw,18px);z-index:12;height:42px;padding:0 clamp(14px,2vw,20px);border-radius:22px;background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.7);color:#F2E6C9;font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:opacity 500ms ease">&#8634;&nbsp; Turn around</button>
    <div id="sections" style="position:absolute;left:50%;top:clamp(12px,2vw,24px);transform:translateX(-50%);z-index:11;display:none;gap:5px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 340px)">
      <button data-card="main" data-stop="detMain" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Details</button>
      <button data-card="schedule" data-stop="detSchedule" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Schedule</button>
      <button data-card="travel" data-stop="detTravel" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Travel</button>
      <button data-card="stay" data-stop="detStay" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Accommodations</button>
      <button data-card="logistics" data-stop="detFrontL" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Logistics</button>
      <button data-card="policies" data-stop="detFrontR" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Policies</button>
      <button data-card="registry" data-stop="detShop" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">RSVP</button>
    </div>
    <div id="compass" style="position:absolute;left:50%;bottom:4px;transform:translateX(-50%);z-index:14;opacity:0;transition:opacity 900ms ease;display:grid;grid-template-columns:28px auto 28px;grid-template-rows:28px auto 28px;align-items:center;justify-items:center;gap:1px 4px">
      <button data-fwd="1" style="grid-area:1/2" aria-label="Walk on" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V3M3 7l4-4 4 4"/></svg></button>
      <button id="left" style="grid-area:2/1" aria-label="Look left" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7H3M7 3L3 7l4 4"/></svg></button>
      <p id="hint" style="grid-area:2/2;margin:0;padding:2px 12px;border-radius:12px;background:rgba(26,18,8,.5);backdrop-filter:blur(2px);font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:14px;line-height:1.3;color:#F2DFA8;white-space:nowrap;pointer-events:none">Go ahead &ndash; touch the art</p>
      <button id="right" style="grid-area:2/3" aria-label="Look right" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M7 3l4 4-4 4"/></svg></button>
      <button id="back" style="grid-area:3/2" aria-label="Step back" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M3 7l4 4 4-4"/></svg></button>
    </div>
  </div>

  <div id="label" style="position:relative;z-index:12;flex:none;padding:0 clamp(14px,3vw,34px);opacity:0;transition:opacity 700ms ease">
    <div style="max-width:1040px;margin:0 auto;border-top:1px solid rgba(201,166,103,.6);padding:clamp(15px,2vw,22px) 0 clamp(8px,1.2vw,12px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px clamp(20px,3vw,40px);align-items:start">
      <div>
        <p id="eyebrow" style="margin:0 0 8px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#C9A667;transition:color 700ms ease"></p>
        <h2 id="title" style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(23px,3vw,33px);line-height:1.18;color:#F6F1E4"></h2>
        <button id="more" style="visibility:hidden;margin-top:clamp(10px,1.3vw,15px);height:38px;padding:0 18px;background:rgba(232,192,122,.12);border:1px solid rgba(201,166,103,.7);color:#F2E6C9;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase">Read the full details &nbsp;&rarr;</button>
      </div>
      <div style="height:calc(clamp(15.5px,1.25vw,17.5px) * 6.48 + 54px);overflow-y:auto">
        <p id="body" style="margin:0 0 9px;font-size:clamp(15.5px,1.25vw,17.5px);line-height:1.62;color:#E6DCC4"></p>
        <p id="meta" style="margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B5A88C"></p>
      </div>
    </div>
  </div>

  <div id="nav" style="position:relative;z-index:13;flex:none;padding:6px clamp(14px,3vw,34px) 14px;opacity:0;transition:opacity 700ms ease">
    <div style="max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:clamp(8px,1.4vw,14px)">
      <button data-back="1" aria-label="Step back" style="width:46px;height:46px;border-radius:50%;background:rgba(10,9,8,.6);border:1px solid rgba(201,166,103,.5);color:#F2E6C9;font-size:15px;cursor:pointer;flex:none">&larr;</button>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.2vw,14px)">
        <button data-room="atrium" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Atrium</button>
        <button data-room="w1" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Wing I</button>
        <button data-room="w2" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Wing II</button>
        <button data-room="det" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Details</button>
      </div>
      <button id="creditsBtn" style="height:46px;padding:0 clamp(12px,2vw,18px);background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;flex:none;white-space:nowrap">Credits</button>
    </div>
  </div>
</div>

<div id="credits" style="position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:clamp(16px,4vw,48px);background:rgba(20,15,10,.72)">
  <div style="max-width:620px;max-height:84vh;overflow:auto;background:#2B2520;border:1px solid rgba(201,166,103,.45);padding:clamp(20px,3.4vw,36px)">
    <p style="margin:0 0 18px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#C9A667">Credits</p>
    <div id="creditsList"></div>
    <button id="creditsClose" style="margin-top:8px;height:40px;padding:0 20px;background:transparent;border:1px solid rgba(201,166,103,.5);color:#F2E6C9;font-size:10px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer">Close</button>
  </div>
</div>

<!-- the wall-text card: the long version of a details section, set like a gallery placard -->
<div id="card" style="position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:clamp(14px,4vw,48px);background:rgba(20,15,10,.74)">
  <article id="cardSheet" style="width:min(680px,100%);max-height:86vh;overflow:auto;background:#F6F1E4;color:#2B2520;padding:clamp(24px,4.5vw,52px);box-shadow:0 18px 60px rgba(0,0,0,.55);border-top:5px solid #7A1A3C">
    <p style="margin:0 0 10px;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#7A1A3C">Exhibit details</p>
    <h2 id="cardTitle" style="margin:0 0 6px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.12"></h2>
    <div id="cardBody"></div>
    <button id="cardClose" style="margin-top:26px;height:40px;padding:0 22px;background:transparent;border:1px solid #7A1A3C;color:#7A1A3C;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase">Close</button>
  </article>
</div>

<!-- ENTRANCE -->
<div id="loadbar" style="position:fixed;left:0;top:0;height:3px;width:0;z-index:72;background:linear-gradient(90deg,#A98436,#F3DFA6,#D8B368);box-shadow:0 0 6px rgba(243,223,166,.6);transition:width 400ms ease,opacity 900ms ease;pointer-events:none"></div>
<div id="loadnote" style="position:fixed;left:0;right:0;bottom:3.2vh;z-index:72;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:15px;letter-spacing:.04em;color:#D9C48C;text-shadow:0 1px 2px rgba(0,0,0,.7);transition:opacity 900ms ease;pointer-events:none">Hanging the collection&hellip;</div>
<div id="gate" style="position:fixed;inset:0;z-index:70">
  <div id="doorL" style="position:absolute;left:0;top:0;width:50.4%;height:100%;overflow:hidden;background:#3A2A1A url(assets/door-walnut-stile.jpg) center/cover;border-right:5px solid #140C06;box-shadow:inset -24px 0 44px -26px rgba(0,0,0,.95);transition:transform 2200ms cubic-bezier(.58,0,.2,1)">
    <div style="position:absolute;left:12%;right:12%;background:url(assets/door-walnut-rail.jpg) center/cover;box-shadow:-1px 0 0 rgba(0,0,0,.5),1px 0 0 rgba(0,0,0,.5);top:0;height:9%"></div>
    <div style="position:absolute;left:12%;right:12%;top:9%;height:37%;border-style:solid;border-width:clamp(7px,1.1vw,14px);border-color:rgba(0,0,0,.62) rgba(255,222,170,.13) rgba(255,222,170,.24) rgba(0,0,0,.5);background:url(assets/door-walnut-stile.jpg) center/cover;box-shadow:0 0 0 1px rgba(0,0,0,.65)">
      <div style="position:absolute;inset:0;overflow:hidden;background:url(assets/door-walnut-panel.jpg) center/cover;box-shadow:inset 0 14px 20px -8px rgba(0,0,0,.85),inset 12px 0 18px -9px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,225,180,.14),inset 0 0 0 1px rgba(0,0,0,.55)">
        <div style="position:absolute;inset:clamp(12px,2.4vw,34px);border-style:solid;border-width:clamp(6px,.9vw,12px);border-color:rgba(255,226,178,.26) rgba(0,0,0,.42) rgba(0,0,0,.62) rgba(255,226,178,.12);background:url(assets/door-walnut-panel.jpg) center/cover;box-shadow:0 8px 16px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)"></div>
      </div>
    </div>
    <div style="position:absolute;left:12%;right:12%;background:url(assets/door-walnut-rail.jpg) center/cover;box-shadow:-1px 0 0 rgba(0,0,0,.5),1px 0 0 rgba(0,0,0,.5);top:46%;height:8.6%"></div>
    <div style="position:absolute;left:12%;right:12%;top:49%;height:2.6%"></div>
    <div style="position:absolute;left:12%;right:12%;top:54.6%;height:34.4%;border-style:solid;border-width:clamp(7px,1.1vw,14px);border-color:rgba(0,0,0,.62) rgba(255,222,170,.13) rgba(255,222,170,.24) rgba(0,0,0,.5);background:url(assets/door-walnut-stile.jpg) center/cover;box-shadow:0 0 0 1px rgba(0,0,0,.65)">
      <div style="position:absolute;inset:0;overflow:hidden;background:url(assets/door-walnut-panel.jpg) center/cover;box-shadow:inset 0 14px 20px -8px rgba(0,0,0,.85),inset 12px 0 18px -9px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,225,180,.14),inset 0 0 0 1px rgba(0,0,0,.55)">
        <div style="position:absolute;inset:clamp(12px,2.4vw,34px);border-style:solid;border-width:clamp(6px,.9vw,12px);border-color:rgba(255,226,178,.26) rgba(0,0,0,.42) rgba(0,0,0,.62) rgba(255,226,178,.12);background:url(assets/door-walnut-panel.jpg) center/cover;box-shadow:0 8px 16px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)"></div>
      </div>
    </div>

<script>
(function alignAnd() {
  function fit() {
    var copy = document.getElementById('gateCopy');
    if (!copy) return;
    var span = copy.querySelector('h1 span');
    var rail = document.querySelector('#doorL div[style*="top:49%"]');
    if (!span || !rail) return;
    copy.style.transform = 'translateY(0px)';
    var a = span.getBoundingClientRect();
    var r = rail.getBoundingClientRect();
    var dy = (r.top + r.height / 2) - (a.top + a.height / 2);
    copy.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  document.addEventListener('DOMContentLoaded', fit);
  setTimeout(fit, 400);
  setTimeout(fit, 1600);
})();
</script>
