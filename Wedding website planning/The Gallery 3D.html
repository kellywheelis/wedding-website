<style>
  html, body { margin: 0; height: 100%; background: #2B2520; color: #EDE7D7; font-family: 'EB Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  * { box-sizing: border-box; }
  p { text-wrap: pretty; }
  button { font-family: inherit; }
  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; }
  @keyframes drawRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>

<body>
<div id="shell">
  <div id="stage"><canvas id="view"></canvas>
    <button id="back" aria-label="Step back" style="position:absolute;left:clamp(12px,2vw,24px);top:clamp(12px,2vw,24px);z-index:12;height:42px;padding:0 clamp(14px,2vw,20px);border-radius:22px;background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.7);color:#F2E6C9;font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 500ms ease">&larr;&nbsp; Step back</button>
    <button data-fwd="1" aria-label="Walk forward" style="position:absolute;right:clamp(12px,2vw,24px);top:clamp(12px,2vw,24px);z-index:12;height:42px;padding:0 clamp(14px,2vw,20px);border-radius:22px;background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.7);color:#F2E6C9;font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;white-space:nowrap">Walk on &nbsp;&rarr;</button>
  </div>

  <div id="label" style="position:relative;z-index:12;flex:none;padding:0 clamp(14px,3vw,34px);opacity:0;transition:opacity 700ms ease">
    <div style="max-width:1040px;margin:0 auto;border-top:1px solid rgba(201,166,103,.32);padding:clamp(13px,1.8vw,20px) 0 clamp(6px,1vw,10px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px clamp(20px,3vw,40px);align-items:start">
      <div>
        <p id="eyebrow" style="margin:0 0 7px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#C9A667;transition:color 700ms ease"></p>
        <h2 id="title" style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(20px,2.6vw,28px);line-height:1.2;color:#F6F1E4"></h2>
      </div>
      <div>
        <p id="body" style="margin:0 0 8px;font-size:15px;line-height:1.7;color:#BCB29B"></p>
        <p id="meta" style="margin:0;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#988E7C"></p>
      </div>
    </div>
  </div>

  <div id="nav" style="position:relative;z-index:13;flex:none;padding:6px clamp(14px,3vw,34px) 14px;opacity:0;transition:opacity 700ms ease">
    <div style="max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:clamp(8px,1.4vw,14px)">
      <button data-back="1" aria-label="Step back" style="width:46px;height:46px;border-radius:50%;background:rgba(10,9,8,.6);border:1px solid rgba(201,166,103,.5);color:#F2E6C9;font-size:15px;cursor:pointer;flex:none">&larr;</button>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(6px,1.2vw,14px)">
        <button data-room="atrium" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Atrium</button>
        <button data-room="w1" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Wing I</button>
        <button data-room="w2" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Wing II</button>
        <button data-room="det" style="flex:1;min-width:0;height:46px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Details</button>
      </div>
      <button id="creditsBtn" style="height:46px;padding:0 clamp(12px,2vw,18px);background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;flex:none;white-space:nowrap">Credits</button>
    </div>
  </div>
</div>

<div id="credits" style="position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:clamp(16px,4vw,48px);background:rgba(20,15,10,.72)">
  <div style="max-width:620px;max-height:84vh;overflow:auto;background:#2B2520;border:1px solid rgba(201,166,103,.45);padding:clamp(20px,3.4vw,36px)">
    <p style="margin:0 0 18px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#C9A667">Credits</p>
    <div id="creditsList"></div>
    <button id="creditsClose" style="margin-top:8px;height:40px;padding:0 20px;background:transparent;border:1px solid rgba(201,166,103,.5);color:#F2E6C9;font-size:10px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer">Close</button>
  </div>
</div>

        <div style="position:absolute;inset:clamp(12px,2.4vw,34px);border-style:solid;border-width:clamp(6px,.9vw,12px);border-color:rgba(255,226,178,.26) rgba(0,0,0,.42) rgba(0,0,0,.62) rgba(255,226,178,.12);background:url(assets/door-walnut-panel.jpg) center/cover;box-shadow:0 8px 16px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)"></div>

    <div style="--m:clamp(104px,20vh,200px);position:absolute;left:calc(49.6vw + 2.5px - var(--m) / 2);top:calc(15.5% - var(--m) / 2);width:var(--m);height:var(--m);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7)) drop-shadow(0 -1px 0 rgba(255,244,214,.28))">
      <div style="position:absolute;inset:0;background:linear-gradient(125deg,#5E4718 0%,#A98436 22%,#F3DFA6 42%,#D8B368 55%,#8E6E2B 76%,#5E4718 100%);-webkit-mask:url(assets/monogram-ka.png) center/contain no-repeat;mask:url(assets/monogram-ka.png) center/contain no-repeat"></div>

      <div style="position:absolute;right:4px;top:12px;width:2px;height:136px;border-radius:1px;background:linear-gradient(180deg,rgba(255,252,236,.9),rgba(255,252,236,.25) 40%,rgba(255,252,236,.75))"></div>

      <div style="position:absolute;inset:0;overflow:hidden;background:url(assets/door-walnut-panel.jpg) center/cover;box-shadow:inset 0 14px 20px -8px rgba(0,0,0,.85),inset 12px 0 18px -9px rgba(0,0,0,.6),inset 0 -1px 0 rgba(255,225,180,.14),inset 0 0 0 1px rgba(0,0,0,.55)">
        <div style="position:absolute;inset:clamp(12px,2.4vw,34px);border-style:solid;border-width:clamp(6px,.9vw,12px);border-color:rgba(255,226,178,.26) rgba(0,0,0,.42) rgba(0,0,0,.62) rgba(255,226,178,.12);background:url(assets/door-walnut-panel.jpg) center/cover;box-shadow:0 8px 16px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4)"></div>
      </div>
    </div>
    <div style="position:absolute;left:12%;right:12%;background:url(assets/door-walnut-rail.jpg) center/cover;box-shadow:-1px 0 0 rgba(0,0,0,.5),1px 0 0 rgba(0,0,0,.5);top:89%;height:11%"></div>
    <div style="position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,232,190,.12) 0%,rgba(255,232,190,0) 26%,rgba(0,0,0,0) 58%,rgba(0,0,0,.45) 100%),radial-gradient(ellipse 130% 95% at 0% 45%,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%)"></div>
    <div style="--m:clamp(104px,20vh,200px);position:absolute;left:calc(-2.5px - var(--m) / 2);top:calc(15.5% - var(--m) / 2);width:var(--m);height:var(--m);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.7)) drop-shadow(0 -1px 0 rgba(255,244,214,.28))">
      <div style="position:absolute;inset:0;background:linear-gradient(125deg,#5E4718 0%,#A98436 22%,#F3DFA6 42%,#D8B368 55%,#8E6E2B 76%,#5E4718 100%);-webkit-mask:url(assets/monogram-ka.png) center/contain no-repeat;mask:url(assets/monogram-ka.png) center/contain no-repeat"></div>

  <div style="position:absolute;left:0;right:0;top:74%;transform:translateY(-50%);z-index:10;display:flex;justify-content:center;pointer-events:none">

<script>
(function alignAnd() {
  function fit() {
    var copy = document.getElementById('gateCopy');
    if (!copy) return;
    var span = copy.querySelector('h1 span');
    var rail = document.querySelector('#doorL div[style*="top:49%"]');
    if (!span || !rail) return;
    copy.style.transform = 'translateY(0px)';
    var a = span.getBoundingClientRect();
    var r = rail.getBoundingClientRect();
    var dy = (r.top + r.height / 2) - (a.top + a.height / 2);
    copy.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  document.addEventListener('DOMContentLoaded', fit);
  setTimeout(fit, 400);
  setTimeout(fit, 1600);
})();
</script>
