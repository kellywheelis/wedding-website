<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Gallery</title>
<script>
// phones go to the mobile edition (Vercel does this before the page loads; this is the fallback for other hosts).
// `?desktop` on the address keeps you here.
if (!/[?&]desktop/.test(location.search) && /iPhone|iPod|Android.*Mobile|Windows Phone|Mobi/i.test(navigator.userAgent) && Math.min(screen.width, screen.height) < 700) location.replace('/mobile/');
</script>
<link rel="preload" as="image" href="assets/cursor.png" />
<link rel="preload" as="image" href="assets/cursor-on.png" />
<link rel="preload" as="image" href="assets/cursor-find.png" />
<link href="assets/fonts/gallery.css" rel="stylesheet" />
<script type="importmap">
{
  "imports": {
    "three": "./assets/lib/three/build/three.module.js",
    "three/addons/loaders/GLTFLoader.js": "./assets/lib/three/examples/jsm/loaders/GLTFLoader.js",
    "three/addons/libs/meshopt_decoder.module.js": "./assets/lib/three/examples/jsm/libs/meshopt_decoder.module.js"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: #2B2520; color: #EDE7D7; font-family: 'EB Garamond', Georgia, serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  * { box-sizing: border-box; }
  p { text-wrap: pretty; }
  button { font-family: inherit; }
  #shell { position: fixed; inset: 0; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #view { display: block; width: 100%; height: 100%; }
  @keyframes drawRule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes riseIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  #cardBody h3 { margin: 26px 0 6px; font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 22px; color: #2B2520; border-top: 1px solid rgba(122,26,60,.25); padding-top: 16px; }
  #cardBody p { margin: 0 0 10px; font-size: 17px; line-height: 1.65; color: #4a4137; }
  /* one themed cursor everywhere: Cupid's arrow. Over anything you can click, the same arrow lights up
     (rose heart, gold glow). The hot spot is the tip of the heart. */
  :root { --cur: url("assets/cursor.png") 3 3, auto; --cur-on: url("assets/cursor-on.png") 3 3, pointer; --cur-find: url("assets/cursor-find.png") 11 11, zoom-in; }   /* pre-rendered PNGs: an SVG cursor is re-rasterised on every change, which flashes the default arrow */
  html, body, #view { cursor: var(--cur); }
  button { cursor: var(--cur-on) !important; }
  .cbtn { width: 28px; height: 28px; border-radius: 50%; background: rgba(26,18,8,.55); backdrop-filter: blur(2px); border: 1px solid rgba(232,192,122,.7); color: #F2E6C9; display: grid; place-items: center; padding: 0; transition: opacity 400ms ease, background 200ms ease; }
  .cbtn:hover { background: rgba(232,192,122,.22); }
  .pcpill { display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid rgba(122,26,60,.55);border-radius:14px;color:#2B2520;cursor:var(--cur-on);background:rgba(255,255,255,.3) }
  .pcpill input { accent-color:#7A1A3C;margin:0 }
  .pcpill:has(input:checked) { background:rgba(122,26,60,.12);border-color:#7A1A3C }
  .pcfield { display:grid;gap:2px;font-size:clamp(9px,1.1vw,11px);letter-spacing:.14em;text-transform:uppercase;color:#7A1A3C }
  .pcfield input { width:100%;border:0;border-bottom:1px solid rgba(43,37,32,.45);background:transparent;padding:2px 0;font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(14px,2vw,19px);color:#2B2520;outline:none;letter-spacing:0;text-transform:none }
  .pcfield input:focus { border-bottom-color:#7A1A3C }
  .pcbtn { height:38px;padding:0 20px;background:rgba(232,192,122,.12);border:1px solid rgba(201,166,103,.7);color:#F2E6C9;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase }
  .pcbtn:hover { background:rgba(232,192,122,.24) }
  .navarrow { display:flex;align-items:center;flex:none;opacity:.75; }
  /* the info panel's text eases in afresh each time it changes, so a new write-up catches the eye */
  @keyframes labelIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  #label .fresh { animation: labelIn 900ms ease both; }
  #label .fresh + * , #label div + div .fresh { animation-delay: 140ms; }
  /* the collection tally: bottom left of the view, set in from the corner and wide enough to be noticed, but never
     reaching the compass in the middle (half its width is at most ~130px, plus a 16px gap); back to the corner when narrow */
  #tally { left:min(7.4%,111px);bottom:2px;box-sizing:border-box;width:min(384px,calc(50% - 146px - min(7.4%,111px)));padding:12px 24px;text-align:center }
  @media (max-width: 960px) { #tally { left:14px;bottom:10px;width:auto;padding:8px 24px;text-align:left } }
</style>
</head>
<body>
<div id="shell">
  <div id="stage"><canvas id="view"></canvas>
<div id="tally" style="position:absolute;z-index:14;opacity:0;transition:opacity 900ms ease;border-radius:12px;background:rgba(26,18,8,.5);backdrop-filter:blur(2px);font-family:'Cormorant Garamond',Georgia,serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#F2DFA8;pointer-events:none;white-space:nowrap"></div>
<div id="motto" style="position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:clamp(60px,12vh,120px) clamp(20px,6vw,70px) clamp(20px,6vw,70px);pointer-events:none;opacity:0;transition:opacity 2200ms ease">
  <div style="max-width:min(760px,94vw);text-align:center;padding:clamp(36px,6vw,80px) clamp(40px,8vw,110px);background:radial-gradient(ellipse closest-side,rgba(251,246,232,.7) 0%,rgba(251,246,232,.54) 50%,rgba(251,246,232,0) 100%)">
    <p style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-style:italic;font-size:clamp(24px,3.6vw,42px);line-height:1.26;background:linear-gradient(104deg,#8a6518 0%,#a67d24 24%,#96711e 50%,#a67d24 76%,#8a6518 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 rgba(255,250,235,.7)) drop-shadow(0 1px 2px rgba(70,48,8,.45))">&ldquo;I am a museum of everything I&rsquo;ve ever loved&hellip;&rdquo;</p>
  </div>
</div>
    <button id="turn" aria-label="Turn around" style="opacity:0;transition:opacity 900ms ease;position:absolute;right:clamp(12px,2vw,24px);bottom:clamp(10px,1.6vw,18px);z-index:12;height:42px;padding:0 clamp(14px,2vw,20px);border-radius:22px;background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.7);color:#F2E6C9;font-size:11px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:opacity 500ms ease">&#8634;&nbsp; Turn around</button>
    <div id="sections" style="position:absolute;left:50%;top:clamp(12px,2vw,24px);transform:translateX(-50%);z-index:11;display:none;transition:opacity 700ms ease;gap:5px;flex-wrap:nowrap;justify-content:center;max-width:calc(100% - 40px)">
      <button data-card="logistics" data-stop="detFrontL" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Logistics</button>
      <button data-card="schedule" data-stop="detSchedule" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Schedule</button>
      <button data-card="travel" data-stop="detTravel" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Travel</button>
      <button data-card="registry" data-stop="detShop" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">RSVP</button>
      <button data-card="stay" data-stop="detStay" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Accommodations</button>
      <button data-card="main" data-stop="detMain" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Details</button>
      <button data-card="policies" data-stop="detFrontR" style="background:rgba(26,18,8,.55);backdrop-filter:blur(2px);border:1px solid rgba(232,192,122,.95);box-shadow:0 0 0 1px rgba(26,18,8,.5),inset 0 0 0 1px rgba(232,192,122,.35);color:#F2DFA8;height:34px;padding:0 10px;border-radius:17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;white-space:nowrap">Policies</button>
    </div>
    <div id="compass" style="position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:14;opacity:0;transition:opacity 900ms ease;display:grid;grid-template-columns:28px auto 28px;grid-template-rows:28px auto 28px;align-items:center;justify-items:center;gap:1px 4px">
      <button data-fwd="1" style="grid-area:1/2" aria-label="Walk on" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V3M3 7l4-4 4 4"/></svg></button>
      <button id="left" style="grid-area:2/1" aria-label="Look left" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 7H3M7 3L3 7l4 4"/></svg></button>
      <p id="hint" style="grid-area:2/2;margin:0;padding:2px 12px;border-radius:12px;background:rgba(26,18,8,.5);backdrop-filter:blur(2px);font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:14px;line-height:1.3;color:#F2DFA8;white-space:nowrap;pointer-events:none">Go ahead &ndash; touch the art</p>
      <button id="right" style="grid-area:2/3" aria-label="Look right" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h8M7 3l4 4-4 4"/></svg></button>
      <button id="back" style="grid-area:3/2" aria-label="Step back" class="cbtn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M3 7l4 4 4-4"/></svg></button>
    </div>
  </div>

  <div id="label" style="position:relative;z-index:12;flex:none;padding:0 clamp(14px,3vw,34px);opacity:0;transition:opacity 700ms ease">
    <div style="max-width:1040px;margin:0 auto;border-top:1px solid rgba(201,166,103,.6);padding:clamp(10px,1.4vw,15px) 0 clamp(4px,.8vw,8px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:8px clamp(20px,3vw,40px);align-items:start">
      <div>
        <p id="eyebrow" style="margin:0 0 8px;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:#C9A667;transition:color 700ms ease"></p>
        <h2 id="title" style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(23px,3vw,33px);line-height:1.18;color:#F6F1E4"></h2>
        <button id="more" style="visibility:hidden;margin-top:clamp(8px,1vw,12px);height:32px;padding:0 16px;background:rgba(232,192,122,.12);border:1px solid rgba(201,166,103,.7);color:#F2E6C9;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase">Read the full details &nbsp;&rarr;</button>
      </div>
      <div style="height:calc(clamp(15.5px,1.25vw,17.5px) * 5.2 + 44px);overflow-y:auto">
        <p id="body" style="margin:0 0 9px;font-size:clamp(15.5px,1.25vw,17.5px);line-height:1.62;color:#E6DCC4"></p>
        <p id="meta" style="margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#B5A88C"></p>
      </div>
    </div>
  </div>

  <div id="nav" style="position:relative;z-index:13;flex:none;padding:2px clamp(14px,3vw,34px) 9px;opacity:0;transition:opacity 700ms ease">
    <div style="max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:clamp(8px,1.4vw,14px)">
      <button data-back="1" aria-label="Step back" style="width:32px;height:32px;border-radius:50%;background:rgba(10,9,8,.6);border:1px solid rgba(201,166,103,.5);color:#F2E6C9;font-size:13px;cursor:pointer;flex:none">&larr;</button>
      <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(4px,.7vw,8px)">
        <button data-room="atrium" style="flex:0 1 150px;min-width:0;height:32px;padding:0 10px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Atrium</button>
        <span class="navarrow" aria-hidden="true"><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#C9A667" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h11M8 1l4 4-4 4"/></svg></span>
        <button data-room="w1" style="flex:0 1 150px;min-width:0;height:32px;padding:0 10px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Wing I</button>
        <span class="navarrow" aria-hidden="true"><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#C9A667" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h11M8 1l4 4-4 4"/></svg></span>
        <button data-room="w2" style="flex:0 1 150px;min-width:0;height:32px;padding:0 10px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Wing II</button>
        <span class="navarrow" aria-hidden="true"><svg width="14" height="10" viewBox="0 0 14 10" fill="none" stroke="#C9A667" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h11M8 1l4 4-4 4"/></svg></span>
        <button data-room="det" style="flex:0 1 150px;min-width:0;height:32px;padding:0 10px;background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:all 400ms ease;white-space:nowrap;overflow:hidden">Details</button>
      </div>
      <button id="creditsBtn" style="height:32px;padding:0 clamp(10px,1.4vw,14px);background:transparent;border:1px solid rgba(201,166,103,.3);color:#A79C85;font-size:9px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;flex:none;white-space:nowrap">Credits</button>
    </div>
  </div>
</div>

<div id="credits" style="position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:clamp(16px,4vw,48px);background:rgba(20,15,10,.72)">
  <div style="max-width:620px;max-height:84vh;overflow:auto;background:#2B2520;border:1px solid rgba(201,166,103,.45);padding:clamp(20px,3.4vw,36px)">
    <p style="margin:0 0 18px;font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:#C9A667">Credits</p>
    <div id="creditsList"></div>
    <button id="creditsClose" style="margin-top:8px;height:40px;padding:0 20px;background:transparent;border:1px solid rgba(201,166,103,.5);color:#F2E6C9;font-size:10px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer">Close</button>
  </div>
</div>

<!-- the wall-text card: the long version of a details section, set like a gallery placard -->
<div id="card" style="position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:clamp(14px,4vw,48px);background:rgba(20,15,10,.74)">
  <article id="cardSheet" style="width:min(680px,100%);max-height:86vh;overflow:auto;background:#F6F1E4;color:#2B2520;padding:clamp(24px,4.5vw,52px);box-shadow:0 18px 60px rgba(0,0,0,.55);border-top:5px solid #7A1A3C">
    <p style="margin:0 0 10px;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#7A1A3C">Exhibit details</p>
    <h2 id="cardTitle" style="margin:0 0 6px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.12"></h2>
    <div id="cardBody"></div>
    <button id="cardClose" style="margin-top:26px;height:40px;padding:0 22px;background:transparent;border:1px solid #7A1A3C;color:#7A1A3C;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase">Close</button>
  </article>
</div>

<!-- THE POSTCARD: pick one from the rack, turn it over, fill it in, post it -->
<div id="postcard" style="position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:clamp(14px,4vw,48px);background:rgba(20,15,10,.78)">
  <div style="width:min(760px,100%);display:grid;justify-items:center;gap:14px">
    <p id="pcEyebrow" style="margin:0;font-size:10.5px;letter-spacing:.34em;text-transform:uppercase;color:#C9A667">The gift shop &middot; postcards</p>
    <div id="pcScene" style="width:100%;aspect-ratio:3/2;perspective:1600px">
      <div id="pcCard" style="position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 900ms cubic-bezier(.4,0,.2,1)">
        <div id="pcFront" style="position:absolute;inset:0;backface-visibility:hidden;background:#F6F1E4;padding:3.2%;box-shadow:0 18px 60px rgba(0,0,0,.55)">
          <div id="pcPic" style="width:100%;height:100%;background:#d8cfbb center/cover no-repeat;box-shadow:inset 0 0 0 1px rgba(122,26,60,.35)"></div>
          <p id="pcTitle" style="position:absolute;left:3.2%;bottom:.9%;margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(11px,1.6vw,15px);color:#6b5b48"></p>
          <div style="position:absolute;right:3.4%;bottom:2.4%;width:14%;aspect-ratio:1;background:linear-gradient(125deg,#5E4718 0%,#A98436 22%,#F3DFA6 42%,#D8B368 55%,#8E6E2B 76%,#5E4718 100%);-webkit-mask:url(assets/monogram-ka.png) center/contain no-repeat;mask:url(assets/monogram-ka.png) center/contain no-repeat;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55)) drop-shadow(0 0 6px rgba(255,236,180,.35))"></div>
        </div>
        <div id="pcBack" style="position:absolute;inset:0;backface-visibility:hidden;transform:rotateY(180deg);background:#F6F1E4 url(assets/tex-plaster.jpg) center/cover;background-blend-mode:multiply;color:#2B2520;box-shadow:0 18px 60px rgba(0,0,0,.55);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;align-content:start;padding:4% 4.5% 3.5%;gap:0 5%;font-family:'EB Garamond',Georgia,serif">
          <p style="grid-column:1/3;margin:0 0 2%;text-align:center;font-size:clamp(9px,1.2vw,11px);letter-spacing:.34em;text-transform:uppercase;color:#7A1A3C">Cartolina postale</p>
          <div style="display:grid;align-content:start;gap:2.2%;font-size:clamp(11px,1.5vw,14.5px)">
            <p style="margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(15px,2.3vw,22px);color:#2B2520">Will you be there?</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <label class="pcpill"><input type="radio" name="pcYes" value="yes"> Yes, with joy</label>
              <label class="pcpill"><input type="radio" name="pcYes" value="no"> No, with regret</label>
            </div>
            <label class="pcfield">Plus-one&rsquo;s name, if you were given one<input id="pcPlus" type="text" autocomplete="off"></label>
            <label class="pcfield">Allergies or dietary needs<input id="pcDiet" type="text" autocomplete="off"></label>
            <label class="pcfield">A note for us<input id="pcNote" type="text" autocomplete="off"></label>
          </div>
          <div style="position:relative;border-left:1px solid rgba(43,37,32,.35);padding-left:5%;display:grid;align-content:start;gap:6%;font-size:clamp(11px,1.5vw,14.5px)">

<script>
(function alignAnd() {
  function fit() {
    var copy = document.getElementById('gateCopy');
    if (!copy) return;
    var span = copy.querySelector('h1 span');
    var rail = document.querySelector('#doorL div[style*="top:49%"]');
    if (!span || !rail) return;
    copy.style.transform = 'translateY(0px)';
    var a = span.getBoundingClientRect();
    var r = rail.getBoundingClientRect();
    var dy = (r.top + r.height / 2) - (a.top + a.height / 2);
    copy.style.transform = 'translateY(' + dy.toFixed(1) + 'px)';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  document.addEventListener('DOMContentLoaded', fit);
  setTimeout(fit, 400);
  setTimeout(fit, 1600);
})();
</script>
