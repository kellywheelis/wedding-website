<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Arcade test</title>
<style>html,body{margin:0;background:#000;height:100%}</style></head>
<body>
<script src="arcade.js"></script>
<script src="italy.js"></script>
<script>
// ?game=italy&sim=title|select|play|win|over : opens the game and, for the play cases, drives it with scripted key presses
// so the harness can screenshot the level with the player mid-climb; ?touch=1 shows the phone controls.
const q = new URLSearchParams(location.search), sim = q.get('sim') || 'title';
if (q.get('touch')) Object.defineProperty(window, 'matchMedia', { value: () => ({ matches: true }) });
Arcade.launch(q.get('game') || 'italy');
const key = (k, ms) => { window.dispatchEvent(new KeyboardEvent('keydown', { key: k })); if (ms) setTimeout(() => window.dispatchEvent(new KeyboardEvent('keyup', { key: k })), ms); };
const seq = [];
if (sim !== 'title') seq.push([200, () => key('Enter', 50)]);
if (sim === 'select') seq.push([500, () => key('ArrowRight', 50)]);
if (sim === 'play' || sim === 'win' || sim === 'over') { seq.push([600, () => key('Enter', 50)]); seq.push([2200, () => key('ArrowRight', 2600)]); seq.push([4900, () => key('ArrowUp', 1400)]); seq.push([6400, () => key('ArrowLeft', 900)]); seq.push([7000, () => key(' ', 50)]); }
seq.forEach(([t, f]) => setTimeout(f, t));
// ?sim=run : start straight into play as the groom and step the game deterministically: walk right, climb, walk left, jump
if (sim === 'run') { const g = Arcade.current.inst.debug; g.start(q.get('who') || 'groom'); const st = Arcade.step;
  st(170, ['right']); st(100, ['up']); st(60, ['left']); st(1, ['jump']); st(20, []); st(40, ['left']); st(10, []);
  document.title = 'x' + Math.round(g.S.p.x) + ' y' + Math.round(g.S.p.y) + ' plat' + g.S.p.plat + ' lives' + g.S.lives + ' score' + g.S.score + ' items' + Object.keys(g.S.items).join(',') + ' cases' + g.S.cases.length; }
</script>
</body></html>
